# Single-VM deployment: one container, one volume.
# Copy .env.example to .env, fill in owner values, then:
#   docker compose up -d
# See docs/RUNBOOK.md. Nothing here deploys anything by itself.
services:
  pa:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PA_ENV: production
      PA_DATA_DIR: /data
      PA_BIND: 0.0.0.0              # container iface; publish rule is the boundary
      PA_CONTAINER_BIND: "true"
      PA_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"       # host loopback only; terminator in front
    volumes:
      - pa_data:/data
      # - /srv/vault-mirror:/vault:ro   # Obsidian mirror -> VAULT_PATH=/vault
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pa_data:
